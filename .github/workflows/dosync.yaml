name: Do Tools Sync For Abldg

# 共享同步逻辑位于私有仓库 shared_actions/sync_kubectl.yaml(组合 action)
# 请将下方 OWNER 替换为你的 GitHub 组织/用户名
on:
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Kubectl 版本号(如 v1.33.6 或 1.33.6,不填则使用最新稳定版)'
        required: false
        type: string
      withsvr:
        description: '包含 SERVER 及 NODE 版本,取值(=0|1)'
        required: false
        type: int
        default: 1

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 同步 Kubectl 二进制
        uses: abldgsync/shared_actions/sync_kubectl.yaml@v1
        with:
          binvern: ${{ inputs.binvern }}
          withsvr: ${{ inputs.withsvr }}
