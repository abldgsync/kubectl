name: Sync Kubectl Binaries

# 共享同步逻辑位于公共(Public)仓库 abldgsync/actions/sync(单一组合 action,通过 with.tool 选择工具)
#(当前引用 @main,建议钉成具体 commit SHA 以获得可复现构建)
on:
  # schedule:
  #   - cron: '0 2 10 * *'  # 每月10号凌晨2点自动执行(已屏蔽,不再定时执行)
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Kubectl 版本号(如 v1.33.6 或 1.33.6,不填则使用最新稳定版)'
        required: false
        type: string
      withsvr:
        description: '包含 SERVER 及 NODE 版本,取值(=0|1)'
        required: false
        type: int
        default: 1

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 同步 Kubectl 二进制
        uses: abldgsync/actions/sync@main
        with:
          tool: kubectl
          binvern: ${{ inputs.binvern }}
          withsvr: ${{ inputs.withsvr }}
